server:
  port: 8081

spring:
  application:
    name: vet-alert-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vetalert}
    username: ${SPRING_DATASOURCE_USERNAME:vetalert}
    password: ${SPRING_DATASOURCE_PASSWORD:vetalert}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
